name: Human Remediation Reopen Adjudication Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reopen-adjudication-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Reopen adjudication regressions
        run: pytest -q tests/test_human_remediation_reopen.py tests/test_human_remediation_reopen_dashboard.py

      - name: Validate tracked empty adjudication ledger
        run: |
          python - <<'PY'
          from roberta_eval.human_remediation_reopen import (
              load_reopen_adjudication_ledger,
              reopen_adjudication_summary,
          )
          ledger = load_reopen_adjudication_ledger()
          summary = reopen_adjudication_summary(ledger)
          assert summary['adjudication_count'] == 0
          assert summary['pending_adjudication_count'] == 0
          assert summary['administrative_count'] == 0
          assert summary['confirmed_regression_count'] == 0
          assert summary['new_cycle_eligible_count'] == 0
          assert summary['automatic_new_cycle_creation'] is False
          assert summary['production_code_mutation'] is False
          assert summary['execution_authorized'] is False
          PY

      - name: Installed reopen CLI smoke
        run: |
          roberta-eval-human-reopen --help
          roberta-eval-human-reopen summary > /tmp/reopen-summary.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/reopen-summary.json'))
          assert data['ledger_version'] == 'roberta_human_remediation_reopen_adjudication_ledger/v1'
          assert data['explicit_owner_adjudication_required'] is True
          assert data['fresh_checkpoint_required_for_regression'] is True
          assert data['automatic_new_cycle_creation'] is False
          assert data['production_code_mutation'] is False
          assert data['execution_authorized'] is False
          PY

      - name: Safety boundary
        run: |
          python - <<'PY'
          from roberta_eval.human_remediation_reopen import empty_reopen_adjudication_ledger
          ledger = empty_reopen_adjudication_ledger()
          assert ledger['policy']['explicit_owner_adjudication_required'] is True
          assert ledger['policy']['fresh_checkpoint_required_for_regression'] is True
          assert ledger['policy']['administrative_reopen_preserves_terminal_closed'] is True
          assert ledger['policy']['automatic_new_cycle_creation'] is False
          assert ledger['policy']['production_code_mutation'] is False
          assert ledger['policy']['execution_authorized'] is False
          PY
