name: Human Remediation Generational Lineage Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generational-lineage-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .[dev]

      - name: Generational lineage regressions
        run: pytest -q tests/test_human_remediation_lineage.py

      - name: Installed lineage CLI smoke
        run: |
          roberta-eval-human-lineage validate > /tmp/human-lineage.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/human-lineage.json'))
          assert report['lineage_version'] == 'roberta_human_remediation_generational_lineage_reconciliation/v1'
          assert report['health_version'] == 'roberta_human_remediation_lineage_health/v1'
          assert report['acyclic'] is True
          assert report['one_parent_per_child'] is True
          assert report['generation_integrity'] is True
          assert report['failure_service_integrity'] is True
          assert report['read_only'] is True
          assert report['automatic_issue_creation'] is False
          assert report['lifecycle_mutation'] is False
          assert report['production_code_mutation'] is False
          assert report['execution_authorized'] is False
          PY

      - name: Safety boundary
        run: |
          python - <<'PY'
          from roberta_eval.human_remediation_lifecycle import load_lifecycle
          from roberta_eval.human_remediation_lineage import build_generational_lineage_report
          from roberta_eval.human_remediation_reopen_cycle import load_reopen_cycle_promotion_ledger

          lifecycle = load_lifecycle()
          ledger = load_reopen_cycle_promotion_ledger()
          report = build_generational_lineage_report(lifecycle, ledger)
          assert report['read_only'] is True
          assert report['advisory_pattern_interpretation'] is True
          assert report['automatic_issue_creation'] is False
          assert report['lifecycle_mutation'] is False
          assert report['production_code_mutation'] is False
          assert report['execution_authorized'] is False
          PY
