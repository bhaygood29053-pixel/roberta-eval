name: Human Root-Cause Artifact Sandbox Gate

on:
  pull_request:
    paths:
      - "src/roberta_eval/human_root_cause_artifact_sandbox.py"
      - "src/roberta_eval/human_root_cause_artifact_handoff.py"
      - "tests/test_human_root_cause_artifact_sandbox.py"
      - "config/human_root_cause_artifact_source.json"
      - "config/human_root_cause_artifact_sandbox_ledger.json"
      - "docs/HUMAN_ROOT_CAUSE_ARTIFACT_SANDBOX.md"
      - "pyproject.toml"
      - ".github/workflows/human-root-cause-artifact-sandbox.yml"
      - "src/roberta_eval/human_root_cause_experiment_execution.py"
      - "src/roberta_eval/human_root_cause_direct_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-sandbox-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Artifact materialization and sandbox regressions
        run: python -m pytest -q tests/test_human_root_cause_artifact_sandbox.py

      - name: Validate accepted ROBERTA source pin
        run: |
          python - <<'PY'
          from roberta_eval.human_root_cause_artifact_sandbox import load_source_pin
          pin = load_source_pin()
          assert pin["repository"] == "bhaygood29053-pixel/roberta-langgraph"
          assert pin["commit_sha"] == "becb264b8026b5cbbf99f0d12dea62463510c6ee"
          assert pin["floating_ref"] is False
          assert pin["production_runtime_touched"] is False
          print(pin["source_pin_sha256"])
          PY

      - name: Validate tracked empty materialization ledger
        run: |
          python - <<'PY'
          from roberta_eval.human_root_cause_artifact_sandbox import load_artifact_sandbox_ledger
          ledger = load_artifact_sandbox_ledger()
          assert ledger["materializations"] == []
          assert ledger["policy"]["target_domain_only_overlay"] is True
          assert ledger["policy"]["production_runtime_touched"] is False
          assert ledger["policy"]["execution_authorized"] is False
          PY

      - name: Installed sandbox CLI smoke
        run: |
          roberta-eval-human-root-cause-sandbox source-pin >/tmp/source-pin.json
          roberta-eval-human-root-cause-sandbox summary >/tmp/sandbox-summary.json
          python - <<'PY'
          import json
          pin = json.load(open('/tmp/source-pin.json'))
          summary = json.load(open('/tmp/sandbox-summary.json'))
          assert pin["runtime_entrypoint"] == "roberta.human_response_renderer:render_human_response"
          assert summary["materialization_count"] == 0
          assert summary["runner_outcome_authority"] is False
          PY

      - name: Production isolation and authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          sandbox = Path("src/roberta_eval/human_root_cause_artifact_sandbox.py").read_text()
          handoff = Path("src/roberta_eval/human_root_cause_artifact_handoff.py").read_text()
          assert "socket.socket = _BlockedSocket" in sandbox
          assert "production_runtime_touched" in sandbox
          assert "execute_materialized_handoff" in handoff
          assert "receipt_to_lab85_result_input(plan, manifest, receipt)" in handoff
          assert "runner_outcome_authority" in handoff
          PY
