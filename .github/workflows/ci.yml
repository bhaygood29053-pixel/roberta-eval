name: Laboratory CI

on:
  push:
    branches: ["main", "lab-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: pytest

      - name: Laboratory doctor
        run: roberta-eval doctor

      - name: Capability registry
        run: roberta-eval capabilities

      - name: Question taxonomy
        run: roberta-eval taxonomy

      - name: Deterministic corpus
        run: roberta-eval corpus --write /tmp/roberta-deterministic-corpus.jsonl

      - name: Runtime harness smoke
        run: roberta-eval run --mode fixture --limit 5 --run-id ci-smoke --output /tmp/roberta-run.jsonl
