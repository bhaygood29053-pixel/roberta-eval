name: Laboratory CI

on:
  push:
    branches: ["main", "lab-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: pytest

      - name: Laboratory doctor
        run: roberta-eval doctor

      - name: Capability registry
        run: roberta-eval capabilities

      - name: Question taxonomy
        run: roberta-eval taxonomy

      - name: Deterministic corpus
        run: roberta-eval corpus --write /tmp/roberta-deterministic-corpus.jsonl

      - name: Runtime harness smoke
        run: roberta-eval run --mode fixture --limit 5 --run-id ci-smoke --output /tmp/roberta-run.jsonl

      - name: Deterministic grader smoke
        run: roberta-eval grade --limit 20 --output /tmp/roberta-grades.jsonl

      - name: Generated question suite
        run: roberta-eval generate --write /tmp/roberta-generated-suite.jsonl

      - name: 2500-case pipeline stress qualification
        run: roberta-eval stress --limit 2500 --json /tmp/stress.json --markdown /tmp/stress.md

      - name: Human quality advisory smoke
        run: roberta-eval quality --input /tmp/roberta-run.jsonl --output /tmp/roberta-quality.jsonl

      - name: Adversarial suite
        run: roberta-eval adversarial --write /tmp/roberta-adversarial-suite.jsonl

      - name: Multi-turn consistency suite
        run: roberta-eval conversations --write /tmp/roberta-conversations.json

      - name: Failure classification smoke
        run: roberta-eval classify --input /tmp/roberta-grades.jsonl --output /tmp/roberta-findings.jsonl

      - name: Root cause localization smoke
        run: roberta-eval localize --input /tmp/roberta-findings.jsonl --output /tmp/roberta-localizations.jsonl

      - name: Failure clustering smoke
        run: roberta-eval cluster --findings /tmp/roberta-findings.jsonl --localizations /tmp/roberta-localizations.jsonl --output /tmp/roberta-clusters.jsonl

      - name: Regression memory
        run: roberta-eval regressions

      - name: Trend intelligence
        run: roberta-eval trends

      - name: Evaluation dashboard
        run: roberta-eval dashboard --json /tmp/roberta-dashboard.json --markdown /tmp/roberta-dashboard.md

      - name: GitHub defect proposal smoke
        run: roberta-eval defect-proposals --clusters /tmp/roberta-clusters.jsonl --output /tmp/roberta-defect-proposals.jsonl
