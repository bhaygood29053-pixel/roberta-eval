name: Human Remediation Reopen Cycle Promotion Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reopen-cycle-promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Reopen cycle promotion regressions
        run: pytest -q tests/test_human_remediation_reopen_cycle.py

      - name: Validate tracked empty promotion ledger
        run: |
          python - <<'PY'
          from roberta_eval.human_remediation_reopen_cycle import (
              load_reopen_cycle_promotion_ledger,
              reopen_cycle_summary,
          )
          from roberta_eval.human_remediation_lifecycle import load_lifecycle
          ledger = load_reopen_cycle_promotion_ledger()
          assert ledger['promotions'] == []
          summary = reopen_cycle_summary(load_lifecycle(), ledger)
          assert summary['promoted_cycle_count'] == 0
          assert summary['automatic_issue_creation'] is False
          assert summary['production_code_mutation'] is False
          assert summary['execution_authorized'] is False
          PY

      - name: Installed reopen cycle CLI smoke
        run: |
          roberta-eval-human-reopen-cycle --help
          roberta-eval-human-reopen-cycle summary > /tmp/reopen-cycle-summary.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/reopen-cycle-summary.json'))
          assert data['ledger_version'] == 'roberta_human_remediation_reopen_cycle_promotion_ledger/v1'
          assert data['promoted_cycle_count'] == 0
          assert data['explicit_owner_approval_required'] is True
          assert data['parent_closed_evidence_required'] is True
          assert data['duplicate_cycle_creation_prevented'] is True
          assert data['automatic_issue_creation'] is False
          assert data['production_code_mutation'] is False
          assert data['execution_authorized'] is False
          PY

      - name: Safety boundary
        run: |
          python - <<'PY'
          from roberta_eval.human_remediation_reopen_cycle import empty_reopen_cycle_promotion_ledger
          ledger = empty_reopen_cycle_promotion_ledger()
          policy = ledger['policy']
          assert policy['explicit_owner_approval_required'] is True
          assert policy['parent_closed_evidence_required'] is True
          assert policy['duplicate_cycle_creation_prevented'] is True
          assert policy['automatic_issue_creation'] is False
          assert policy['production_code_mutation'] is False
          assert policy['execution_authorized'] is False
          PY
