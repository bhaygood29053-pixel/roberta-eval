name: Human Remediation Terminal Reconciliation Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  terminal-reconciliation-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Terminal reconciliation regressions
        run: pytest -q tests/test_human_remediation_terminal.py tests/test_human_remediation_terminal_dashboard.py

      - name: Installed terminal CLI smoke
        run: |
          roberta-eval-human-terminal --help
          roberta-eval-human-terminal summary > /tmp/terminal-summary.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/terminal-summary.json'))
          assert data['terminal_reconciliation_version'] == 'roberta_human_remediation_terminal_reconciliation/v1'
          assert data['read_only'] is True
          assert data['evidence_rewritten'] is False
          assert data['production_code_mutation'] is False
          assert data['execution_authorized'] is False
          PY

      - name: Safety boundary
        run: |
          python - <<'PY'
          from roberta_eval.human_remediation_terminal import build_terminal_reconciliation
          from roberta_eval.human_remediation_lifecycle import load_lifecycle
          from roberta_eval.human_remediation_closure import load_closure_ledger
          report = build_terminal_reconciliation(load_lifecycle(), load_closure_ledger())
          assert report['external_calls'] == 0
          assert report['read_only'] is True
          assert report['evidence_rewritten'] is False
          assert report['production_code_mutation'] is False
          assert report['execution_authorized'] is False
          PY
