[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roberta-eval"
version = "0.1.0"
description = "Independent evaluation and stress-testing laboratory for ROBERTA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roberta-eval = "roberta_eval.cli:main"
roberta-eval-human-trends = "roberta_eval.human_trends:main"
roberta-eval-human-checkpoint = "roberta_eval.human_checkpoint_history:main"
roberta-eval-human-promote = "roberta_eval.human_remediation_promotion:main"
roberta-eval-human-lifecycle = "roberta_eval.human_remediation_lifecycle:main"
roberta-eval-human-actions = "roberta_eval.human_remediation_actions:main"
roberta-eval-human-close = "roberta_eval.human_remediation_closure:main"
roberta-eval-human-terminal = "roberta_eval.human_remediation_terminal:main"
roberta-eval-human-reopen = "roberta_eval.human_remediation_reopen:main"
roberta-eval-human-reopen-cycle = "roberta_eval.human_remediation_reopen_cycle:main"
roberta-eval-human-lineage = "roberta_eval.human_remediation_lineage:main"
roberta-eval-human-root-cause = "roberta_eval.human_remediation_root_cause:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
